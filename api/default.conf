server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log notice;

    location /bad-request {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:8080" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization" always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 400 "preflight failed with 400\n";
        }

        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 200 '{"message":"you should not see this body in the browser when preflight fails"}';
    }

    location /forbidden-with-cors {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:8080" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization" always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 403 "preflight failed with 403\n";
        }

        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 200 '{"message":"you should not see this body in the browser when preflight fails"}';
    }

    location /forbidden-no-cors {
        if ($request_method = OPTIONS) {
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 403 "preflight failed with 403 and no cors headers\n";
        }

        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 200 '{"message":"you should not see this body in the browser when preflight fails"}';
    }

    location /bad-gateway-with-cors {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:8080" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization" always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 502 "preflight failed with 502 and cors headers\n";
        }

        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 200 '{"message":"you should not see this body in the browser when preflight fails"}';
    }

    location /bad-gateway-no-cors {
        if ($request_method = OPTIONS) {
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 502 "preflight failed with 502 and no cors headers\n";
        }

        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 200 '{"message":"you should not see this body in the browser when preflight fails"}';
    }

    location /missing-allow-headers {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:8080" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 200 '{"message":"you should not see this body in the browser when allow-headers is missing"}';
    }

    location /ok {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:8080" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 200 '{"message":"actual GET request succeeded"}';
    }
}
